---
name: Native ELM CPU verification

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cpu:
    name: CPU-only (${{ matrix.feature_set }})
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature_set: disabled
            features: ""
          - feature_set: elm
            features: "elm"
          - feature_set: trading-and-elm
            features: "ci-trading-tests,elm"
    steps:
      - uses: actions/checkout@v5
      - name: Keep Cargo output in the per-job runner temp directory
        # The self-hosted runner is persistent; RUNNER_TEMP is wiped after
        # every job, so the multi-GB target tree is not left behind.
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test feature set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo test --locked --no-default-features --features "${{ matrix.features }}"
          else
            cargo test --locked --no-default-features
          fi
      - name: Lint ELM feature set
        if: matrix.feature_set == 'elm'
        # This crate currently has a repository-wide Clippy warning baseline.
        # Keep reporting it here without making unrelated legacy warnings fail ELM verification.
        run: cargo clippy --locked --all-targets --no-default-features --features elm
